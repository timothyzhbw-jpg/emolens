name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # EmoLens 是 Mac 应用（ScreenCaptureKit、SwiftUI、Vision），只能在 macOS 上编译。
    # 云端会话跑在 Linux 上编译不了，改完推上来靠这里验证。公开仓库的 macOS 机器免费。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Swift 版本
        run: swift --version
      - name: 编译（应用、演示窗口、核心库）
        run: swift build
      - name: 单元测试
        run: swift test
      # 用虚构的示例数据把界面画成 PNG（中英文各一套），不截屏、不需要权限；README 和提交材料的截图从这里下载。
      - name: 渲染界面预览
        continue-on-error: true
        run: |
          swift run EmoLens --render-previews previews/en --language en
          swift run EmoLens --render-previews previews/zh --language zh
      - name: 上传界面预览
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews/
          if-no-files-found: ignore
